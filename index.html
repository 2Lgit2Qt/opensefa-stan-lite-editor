<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenSEFA STAN-lite Editor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="menubar">
    <div class="menu"><button data-i18n="file">File</button>
      <div class="dropdown">
        <button id="miNew" data-i18n="new">New</button>
        <button id="miOpen" data-i18n="open">Open</button>
        <button id="miSave" data-i18n="save">Save project</button>
        <hr>
        <button id="miClean">Example: consistent</button>
        <button id="miConflict">Example: conflict</button>
        <hr>
        <button id="miWorksheet">Export worksheet</button>
        <button id="miJson">Export solver JSON</button>
      </div>
    </div>
    <div class="menu"><button data-i18n="edit">Edit</button>
      <div class="dropdown">
        <button id="miUndo" data-i18n="undo">Undo</button>
        <button id="miRedo" data-i18n="redo">Redo</button>
        <button id="miFind" data-i18n="find">Find objects</button>
        <button id="miDelete" data-i18n="del">Delete</button>
        <hr>
        <button id="miCsv">Import CSV (flows)</button>
        <hr>
        <button id="miMaterials">Define material…</button>
        <button id="miLayers">Layers and periods…</button>
        <button id="miUnits">Define units…</button>
        <button id="miRefs">References…</button>
        <hr>
        <button id="miCalc">Calculation… (Alt+F5)</button>
        <button id="miData">Data Explorer… (Ctrl+D)</button>
      </div>
    </div>
    <div class="menu"><button data-i18n="view">View</button>
      <div class="dropdown">
        <button id="miGrid" data-i18n="grid">Grid</button>
        <button id="miSnap" data-i18n="snap">Snap to grid</button>
        <button id="miZoomIn" data-i18n="zoomIn">Zoom in</button>
        <button id="miZoomOut" data-i18n="zoomOut">Zoom out</button>
        <button id="miCaption">Caption: name</button>
        <hr>
        <button id="miLang">Sprache: Deutsch / English</button>
      </div>
    </div>
    <div class="menu"><button data-i18n="extras">Extras</button>
      <div class="dropdown">
        <button id="miSubgoods">Use subgood layers: off</button>
        <button id="miReset">Reset settings</button>
      </div>
    </div>
  </div>
  <div id="toolbars">
    <div class="tbgroup">
      <button id="tbNew" data-i18n="new">New</button>
      <button id="tbOpen" data-i18n="open">Open</button>
      <button id="tbSave" data-i18n="save">Save</button>
      <button id="tbUndo" data-i18n="undo">Undo</button>
      <button id="tbRedo" data-i18n="redo">Redo</button>
      <button id="tbFind" data-i18n="find">Find</button>
    </div>
    <div class="tbgroup">
      <button id="tbGrid" data-i18n="grid">Grid</button>
      <button id="tbSnap" data-i18n="snap">Snap</button>
      <button id="tbZoomIn">+</button>
      <button id="tbZoomOut">−</button>
    </div>
    <div class="tbgroup">
      <label class="inlbl" data-i18n="layers">Layers</label>
      <select id="layerSelect"></select>
      <label class="inlbl" data-i18n="period">Period</label>
      <select id="periodSelect"></select>
      <button id="tbCsv">CSV</button>
      <button id="tbValidate" data-i18n="validation">Check structure</button>
      <button id="tbSolve" data-i18n="solve">Calculate</button>
    </div>
    <div class="tbgroup">
      <button id="tbSankey" data-i18n="sankey">Show as Sankey</button>
      <button id="tbDisplay" data-i18n="calculated">Calculated</button>
      <button id="tbUnitsMode">Units: entered</button>
    </div>
  </div>
  <div id="crumb"></div>
</header>
<main>
  <aside id="left">
    <div class="pane">
      <h3 data-i18n="explorer">Model Explorer</h3>
      <div id="explorer"></div>
    </div>
    <div class="pane">
      <h3 data-i18n="shapes">Shapes</h3>
      <div id="shapes">
        <button id="shSelect" data-i18n="select">Selection mode</button>
        <button id="shProcess" data-i18n="process">Process</button>
        <button id="shStock" data-i18n="stock">Stock</button>
        <button id="shSubsystem">Subsystem</button>
        <button id="shConnect" data-i18n="connect">Internal flow</button>
        <button id="shText">Text field</button>
        <button id="shDelete" data-i18n="del">Delete</button>
      </div>
    </div>
  </aside>
  <div id="canvasWrap">
    <svg id="canvas"></svg>
  </div>
  <aside id="right">
    <div class="pane">
      <h3 data-i18n="properties">Properties</h3>
      <div id="propTabs"></div>
      <div id="props"></div>
    </div>
    <div class="pane">
      <h3 data-i18n="trace">Trace Output</h3>
      <div id="traceBar"><button id="traceClear" data-i18n="clear">Clear</button></div>
      <div id="traceList"></div>
    </div>
  </aside>
</main>
<div id="findBox" hidden>
  <input id="findInput" placeholder="Search term">
  <div id="findResults"></div>
</div>
<div id="modal" hidden><div id="modalBox"><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
<input type="file" id="openProject" accept=".json" hidden>
<input type="file" id="importCsv" accept=".csv,.txt" hidden>
<script src="c1.js"></script>
<script src="c2.js"></script>
<script src="c3.js"></script>
<script src="c4.js"></script>
<script src="c5.js"></script>
<script src="c6.js"></script>
</body>
</html>
