<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenSEFA STAN-lite Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>OpenSEFA STAN-lite Editor</h1>
  <div class="toolbar">
    <button id="addProcess">+ Process</button>
    <button id="addStock">+ Stock</button>
    <button id="addSubsystem">+ Subsystem</button>
    <button id="connectMode">Connect</button>
    <button id="deleteSel">Delete</button>
    <button id="loadDemo">Load demo</button>
    <button id="validate">Validate</button>
    <button id="sankeyToggle">Sankey: off</button>
    <button id="saveProject">Save project</button>
    <input type="file" id="openProject" accept=".json" hidden>
    <button id="openProjectBtn">Open project</button>
    <input type="file" id="importCsv" accept=".csv,.txt" hidden>
    <button id="importCsvBtn">Import CSV</button>
    <button id="exportJson">Solver JSON</button>
    <button id="solve">Solve</button>
  </div>
</header>
<main>
  <svg id="canvas"></svg>
  <aside id="panel">
    <h2>Properties</h2>
    <div id="props"></div>
    <h2>Validation</h2>
    <div id="validation"></div>
    <h2>Solver</h2>
    <label>Model name<input id="modelName" value="SEFMN model"></label>
    <label>Solver URL<input id="solverUrl" value="http://localhost:8080/solve"></label>
    <h2>Result</h2>
    <div id="resultTable"></div>
    <pre id="output"></pre>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
